version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: eval-pipeline-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_DATABASE: eval_pipeline
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eval-pipeline-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 3000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: eval_pipeline
      OPENAI_API_KEY: ${OPENAI_API_KEY:-YOUR_API_KEY}
    ports:
      - "3000:3000"
    command: >
      sh -c "npm run db:init && node src/app.js"

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eval-pipeline-worker
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: eval_pipeline
      OPENAI_API_KEY: ${OPENAI_API_KEY:-YOUR_API_KEY}
    command: ["node", "src/worker.js"]

volumes:
  mysql_data:
